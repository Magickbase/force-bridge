name: Build and Push Docker Image

on:
  push:
    branches:
      - feature/citest
    tags:
      - 'v*'  # 可选：当推送版本标签时触发

env:
  IMAGE_NAME: ghcr.io/magickbase/nervos/force-bridge
  IMAGE_TAG: 0.1.2

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 步骤1：检出代码
    - name: Checkout repository
      uses: actions/checkout@v4

    # 步骤2：登录 GitHub Container Registry
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ secrets.GHCR_USERNAME }}  # 优先使用自定义用户名
        password: ${{ secrets.GHCR_TOKEN }}  # 需要创建名为 CR_PAT 的 secret

    # 步骤3：构建并推送 Docker 镜像
    - name: Build and Push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        tags: |
          ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          ${{ env.IMAGE_NAME }}:latest  # 可选：同时推送 latest 标签
        push: true
        # cache-from: type=gha
        # cache-to: type=gha,mode=max

    # 可选步骤：输出镜像信息
    - name: Show Image Info
      run: |
        echo "Successfully pushed image:"
        echo "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
